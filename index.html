<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Cube Solver</title>
<!-- Kociemba two-phase solver (cubejs). cube.js is used on the main thread for state simulation;
     cube.js + solve.js are also loaded inside a Web Worker so solver init doesn't freeze the UI. -->
<script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/cube.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel2: #20242d; --line: #2c313c;
    --text: #e7e9ee; --muted: #8b93a3; --accent: #4f8cff; --ok: #3ccf7a; --warn: #f5b942; --bad: #ff5d5d;
    --cU: #f4f4f4; --cR: #d6262b; --cF: #1fa64a; --cD: #ffd500; --cL: #ff7a00; --cB: #1e5bd8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 18px; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.busy { background: var(--warn); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px;
    max-width: 1200px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .msg { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.2em; }
  .msg.err { color: var(--bad); }

  /* 3D cube */
  .views { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: center; }
  .scene { width: 210px; height: 210px; perspective: 700px; touch-action: none; cursor: grab; flex: none; }
  .cube3d { position: relative; width: 120px; height: 120px; margin: 45px; transform-style: preserve-3d; }
  .face3d { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
    padding: 3px; background: #111; border-radius: 6px; backface-visibility: hidden; }
  .face3d div { border-radius: 4px; transition: background-color .12s; }
  .f-U { transform: rotateX(90deg) translateZ(60px); }
  .f-D { transform: rotateX(-90deg) translateZ(60px); }
  .f-F { transform: translateZ(60px); }
  .f-B { transform: rotateY(180deg) translateZ(60px); }
  .f-R { transform: rotateY(90deg) translateZ(60px); }
  .f-L { transform: rotateY(-90deg) translateZ(60px); }
  /* 2D net */
  .net { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; width: min(100%, 360px); }
  .net div { aspect-ratio: 1; border-radius: 3px; transition: background-color .12s; }
  .net .s { outline: 1px solid rgba(0,0,0,.55); outline-offset: -1px; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }

  /* Solver */
  .next { display: flex; align-items: baseline; gap: 14px; margin: 4px 0 12px; }
  .next .mv { font-size: 56px; font-weight: 800; line-height: 1; min-width: 2.2ch; color: var(--accent); }
  .next .sub { color: var(--muted); font-size: 14px; }
  .moves { display: flex; flex-wrap: wrap; gap: 6px; }
  .moves span { padding: 4px 9px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line);
    font-weight: 600; font-variant-numeric: tabular-nums; }
  .moves span.done { opacity: .35; text-decoration: line-through; }
  .moves span.cur { border-color: var(--accent); background: rgba(79,140,255,.18); }
  .moves span.half { border-color: var(--warn); background: rgba(245,185,66,.16); }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 12px 0 4px; }
  .bar > div { height: 100%; width: 0; background: var(--ok); transition: width .2s; }
  .solved-banner { font-size: 22px; font-weight: 700; color: var(--ok); }
  .sim { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .sim button { padding: 6px 0; }
  .log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted);
    max-height: 140px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    background: var(--panel2); border-radius: 8px; padding: 8px; margin-top: 8px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Mi Smart Magic Cube &middot; Solver</h1>
  <div class="row">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></div>
    <button class="primary" id="btnConnect">Connect cube</button>
    <button id="btnDisconnect" disabled>Disconnect</button>
  </div>
</header>

<main>
  <section>
    <h2>Live cube</h2>
    <div class="views">
      <div>
        <div class="scene" id="scene"><div class="cube3d" id="cube3d"></div></div>
        <div class="hint">Drag to rotate</div>
      </div>
      <div class="net" id="net"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnMarkSolved" disabled title="Tells the cube its current physical state is solved (use if the cube's internal state got out of sync)">Mark cube as solved</button>
      <span class="msg" id="battery" style="margin:0"></span>
    </div>
    <details style="margin-top:12px">
      <summary>Virtual cube (test without hardware)</summary>
      <div class="sim" id="sim"></div>
      <div class="row" style="margin-top:8px">
        <button id="btnScramble">Random scramble</button>
        <button id="btnReset">Reset to solved</button>
      </div>
      <div class="msg">Keyboard: U R F D L B (hold Shift for prime). These apply to the on-screen state; a connected cube overrides it on its next packet.</div>
    </details>
    <details style="margin-top:8px">
      <summary>Bluetooth log</summary>
      <div class="log" id="log"></div>
    </details>
  </section>

  <section>
    <h2>Solution</h2>
    <div id="solverStatus" class="msg" style="margin-top:0">Loading solver&hellip;</div>
    <div class="next">
      <div class="mv" id="nextMove">&ndash;</div>
      <div class="sub" id="nextSub"></div>
    </div>
    <div class="moves" id="moves"></div>
    <div class="bar"><div id="progress"></div></div>
    <div class="msg" id="progressText"></div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="btnSolve" disabled>Solve current state</button>
      <label class="chk"><input type="checkbox" id="autoSolve" checked> Auto-recalculate when I go off track</label>
    </div>
    <div class="msg" id="solveMsg"></div>
  </section>
</main>

<script>
'use strict';

/* ---------------------------------------------------------------------------
 * Constants
 * ------------------------------------------------------------------------- */
const CUBEJS = 'https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/';
const SVC_DATA   = '0000aadb-0000-1000-8000-00805f9b34fb';
const CHR_STATE  = '0000aadc-0000-1000-8000-00805f9b34fb';
// Giiker-family control service (battery / reset). Optional; not every firmware has it.
const SVC_CTRL   = '0000aaaa-0000-1000-8000-00805f9b34fb';
const CHR_CTRL_R = '0000aaab-0000-1000-8000-00805f9b34fb';
const CHR_CTRL_W = '0000aaac-0000-1000-8000-00805f9b34fb';

const SOLVED = 'UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB';
const FACES = 'URFDLB';

/* ---------------------------------------------------------------------------
 * Giiker / Xiaomi 20-byte packet decoding
 *
 * 40 nibbles:
 *   0-7   corner permutation (1..8)
 *   8-15  corner orientation (1..3)
 *   16-27 edge permutation   (1..12)
 *   28-30 edge orientation bits (MSB first, 12 bits)
 *   32-39 last 4 moves as (face, amount) pairs; face 1..6 = B D L U R F,
 *         amount 1 = CW, 2/9 = half, 3 = CCW
 * Some newer firmwares obfuscate the packet (byte 18 == 0xA7); that is undone first.
 * The facelet tables map Giiker's cubie slots onto Kociemba facelet indices
 * (U1..U9 R1..R9 F1..F9 D1..D9 L1..L9 B1..B9 = 0..53).
 * ------------------------------------------------------------------------- */
const C_FACELET = [
  [26, 15, 29], [20, 8, 9], [18, 38, 6], [24, 27, 44],
  [51, 35, 17], [45, 11, 2], [47, 0, 36], [53, 42, 33]
];
const E_FACELET = [
  [25, 28], [23, 12], [19, 7], [21, 41], [32, 16], [5, 10],
  [3, 37], [30, 43], [52, 34], [48, 14], [46, 1], [50, 39]
];
const CO_MASK = [-1, 1, -1, 1, 1, -1, 1, -1];
const DECRYPT_KEY = [176, 81, 104, 224, 86, 137, 237, 119, 38, 26, 193, 161, 210, 126, 150, 81,
  93, 13, 236, 249, 89, 235, 88, 24, 113, 81, 214, 131, 130, 199, 2, 169, 39, 165, 171, 41];

function packetToNibbles(bytes) {
  let raw = Array.from(bytes);
  if (raw.length >= 20 && raw[18] === 0xa7) {
    const k1 = (raw[19] >> 4) & 0xf, k2 = raw[19] & 0xf;
    for (let i = 0; i < 18; i++) raw[i] = (raw[i] + DECRYPT_KEY[i + k1] + DECRYPT_KEY[i + k2]) & 0xff;
    raw = raw.slice(0, 18);
  }
  const v = [];
  for (const b of raw) v.push((b >> 4) & 0xf, b & 0xf);
  return v;
}

function isPerm(arr, n) {
  const seen = new Set(arr);
  return arr.length === n && seen.size === n && arr.every(x => x >= 1 && x <= n);
}

/** Returns { facelets, moves, valid } or null if the packet isn't a state packet. */
function decodePacket(bytes) {
  if (bytes.length < 18) return null;
  const v = packetToNibbles(bytes);
  const cp = v.slice(0, 8), co = v.slice(8, 16), ep = v.slice(16, 28);
  const eo = [];
  for (let i = 0; i < 3; i++) for (let m = 8; m; m >>= 1) eo.push(v[28 + i] & m ? 1 : 0);

  if (!isPerm(cp, 8) || !isPerm(ep, 12) || !co.every(x => x >= 1 && x <= 3)) {
    return { valid: false, nibbles: v };
  }

  const f = [];
  for (let i = 0; i < 54; i++) f[i] = i;
  for (let c = 0; c < 8; c++) {
    const j = cp[c] - 1;
    const ori = (3 + co[c] * CO_MASK[c]) % 3;
    for (let n = 0; n < 3; n++) f[C_FACELET[c][(n + ori) % 3]] = C_FACELET[j][n];
  }
  for (let e = 0; e < 12; e++) {
    const j = ep[e] - 1, ori = eo[e];
    for (let n = 0; n < 2; n++) f[E_FACELET[e][(n + ori) % 2]] = E_FACELET[j][n];
  }
  const facelets = f.map(i => FACES[Math.floor(i / 9)]).join('');

  const moves = [];
  for (let i = 32; i + 1 < v.length; i += 2) {
    const face = v[i], amt = v[i + 1];
    if (face < 1 || face > 6) continue;
    const suffix = amt === 1 ? '' : amt === 3 ? "'" : (amt === 2 || amt === 9) ? '2' : null;
    if (suffix === null) continue;
    moves.push('BDLURF'[face - 1] + suffix);
  }
  return { valid: true, facelets, moves, nibbles: v };
}

/* ---------------------------------------------------------------------------
 * Cube state helpers (via cubejs)
 * ------------------------------------------------------------------------- */
function applyMoves(state, alg) {
  const c = Cube.fromString(state);
  c.move(alg);
  return c.asString();
}
function invertMove(m) {
  return m.endsWith('2') ? m : m.endsWith("'") ? m[0] : m + "'";
}
function colorCountsOk(s) {
  if (!s || s.length !== 54) return false;
  for (const ch of FACES) if (s.split(ch).length - 1 !== 9) return false;
  return true;
}

/* ---------------------------------------------------------------------------
 * Rendering: 3D CSS cube + 2D net
 * ------------------------------------------------------------------------- */
const cube3d = document.getElementById('cube3d');
const netEl = document.getElementById('net');
const sticker3d = [];   // facelet index -> element
const stickerNet = [];

(function buildViews() {
  for (let fi = 0; fi < 6; fi++) {
    const face = document.createElement('div');
    face.className = 'face3d f-' + FACES[fi];
    for (let i = 0; i < 9; i++) {
      const s = document.createElement('div');
      face.appendChild(s);
      sticker3d[fi * 9 + i] = s;
    }
    cube3d.appendChild(face);
  }
  // Net layout on a 12x9 grid: U top, L F R B middle, D bottom.
  const origin = { U: [0, 3], L: [3, 0], F: [3, 3], R: [3, 6], B: [3, 9], D: [6, 3] };
  const cells = new Array(108).fill(null);
  for (let fi = 0; fi < 6; fi++) {
    const [r0, c0] = origin[FACES[fi]];
    for (let i = 0; i < 9; i++) cells[(r0 + Math.floor(i / 3)) * 12 + c0 + (i % 3)] = fi * 9 + i;
  }
  for (const idx of cells) {
    const d = document.createElement('div');
    if (idx !== null) { d.className = 's'; stickerNet[idx] = d; }
    netEl.appendChild(d);
  }
})();

function render(state) {
  for (let i = 0; i < 54; i++) {
    const col = `var(--c${state[i]})`;
    sticker3d[i].style.backgroundColor = col;
    stickerNet[i].style.backgroundColor = col;
  }
}

// Drag-to-rotate for the 3D view.
(function setupDrag() {
  const scene = document.getElementById('scene');
  let rx = -28, ry = -38, drag = null;
  const apply = () => { cube3d.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`; };
  apply();
  scene.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, rx, ry }; scene.setPointerCapture(e.pointerId); scene.style.cursor = 'grabbing'; });
  scene.addEventListener('pointermove', e => {
    if (!drag) return;
    ry = drag.ry + (e.clientX - drag.x) * 0.6;
    rx = Math.max(-89, Math.min(89, drag.rx - (e.clientY - drag.y) * 0.6));
    apply();
  });
  const end = () => { drag = null; scene.style.cursor = 'grab'; };
  scene.addEventListener('pointerup', end);
  scene.addEventListener('pointercancel', end);
})();

/* ---------------------------------------------------------------------------
 * Logging / status
 * ------------------------------------------------------------------------- */
const logEl = document.getElementById('log');
function log(msg) {
  const t = new Date().toLocaleTimeString();
  logEl.textContent = `${t}  ${msg}\n` + logEl.textContent.slice(0, 6000);
}
function setStatus(text, kind) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('dot').className = 'dot' + (kind ? ' ' + kind : '');
}

/* ---------------------------------------------------------------------------
 * Solver (Kociemba two-phase via cubejs in a Web Worker, with main-thread fallback)
 * ------------------------------------------------------------------------- */
const solver = {
  ready: false, worker: null, pending: new Map(), seq: 0, mainThread: false,

  init() {
    const src = `
      importScripts('${CUBEJS}cube.js', '${CUBEJS}solve.js');
      Cube.initSolver();
      postMessage({ ready: true });
      onmessage = (e) => {
        try { postMessage({ id: e.data.id, solution: Cube.fromString(e.data.state).solve() }); }
        catch (err) { postMessage({ id: e.data.id, error: String(err) }); }
      };`;
    try {
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      this.worker = new Worker(url);
      this.worker.onmessage = e => this.onMessage(e.data);
      this.worker.onerror = e => { e.preventDefault(); this.fallback('worker error: ' + (e.message || 'unknown')); };
    } catch (err) {
      this.fallback(String(err));
    }
  },

  fallback(reason) {
    if (this.mainThread) return;
    log('Solver worker unavailable (' + reason + '), loading on main thread');
    if (this.worker) this.worker.terminate();
    this.worker = null;
    this.mainThread = true;
    const s = document.createElement('script');
    s.src = CUBEJS + 'solve.js';
    s.onload = () => setTimeout(() => { Cube.initSolver(); this.onMessage({ ready: true }); }, 30);
    s.onerror = () => solverStatus('Could not load solver from CDN.', true);
    document.head.appendChild(s);
  },

  onMessage(d) {
    if (d.ready) { this.ready = true; onSolverReady(); return; }
    const p = this.pending.get(d.id);
    if (!p) return;
    this.pending.delete(d.id);
    clearTimeout(p.timer);
    d.error ? p.reject(new Error(d.error)) : p.resolve(d.solution);
  },

  solve(state) {
    if (!this.ready) return Promise.reject(new Error('Solver not ready'));
    if (this.mainThread) {
      return new Promise((res, rej) => setTimeout(() => {
        try { res(Cube.fromString(state).solve()); } catch (e) { rej(e); }
      }, 0));
    }
    const id = ++this.seq;
    return new Promise((resolve, reject) => {
      // An impossible state (e.g. bad decode) can make the search run for a long time; give up and restart.
      const timer = setTimeout(() => {
        this.pending.delete(id);
        reject(new Error('Solver timed out — the cube state is probably invalid.'));
        this.worker.terminate(); this.ready = false; this.init();
      }, 15000);
      this.pending.set(id, { resolve, reject, timer });
      this.worker.postMessage({ id, state });
    });
  }
};

/* ---------------------------------------------------------------------------
 * Solution tracking.
 * Tracking is state-based: we precompute the expected cube state after every
 * step and match each incoming state against them. This tolerates dropped
 * packets, half turns done as two quarter turns in either direction, and undos.
 * ------------------------------------------------------------------------- */
const plan = {
  moves: [],      // e.g. ["R", "U'", "F2"]
  states: [],     // states[k] = expected state after k moves (states[0] = start)
  idx: 0,         // moves completed
  half: false,    // first quarter of a half-turn done
  active: false,
};

let current = SOLVED;
let solving = false;

function setPlan(moves, start) {
  plan.moves = moves;
  plan.states = [start];
  for (const m of moves) plan.states.push(applyMoves(plan.states[plan.states.length - 1], m));
  plan.idx = 0; plan.half = false; plan.active = moves.length > 0;
  renderPlan();
}

function clearPlan() {
  plan.moves = []; plan.states = []; plan.idx = 0; plan.half = false; plan.active = false;
  renderPlan();
}

/** Returns true if the new state is consistent with the plan (plan updated), false if off-track. */
function trackState(s) {
  if (!plan.active) return true;
  // Jump forward (or back, after an undo) to any matching expected state.
  for (let k = plan.states.length - 1; k >= 0; k--) {
    if (plan.states[k] === s) { plan.idx = k; plan.half = false; return true; }
  }
  // Halfway through a half-turn?
  const m = plan.moves[plan.idx];
  if (m && m.endsWith('2')) {
    const base = plan.states[plan.idx];
    if (applyMoves(base, m[0]) === s || applyMoves(base, m[0] + "'") === s) { plan.half = true; return true; }
  }
  return false;
}

function renderPlan() {
  const movesEl = document.getElementById('moves');
  const next = document.getElementById('nextMove');
  const sub = document.getElementById('nextSub');
  const prog = document.getElementById('progress');
  const progText = document.getElementById('progressText');
  movesEl.innerHTML = '';

  if (current === SOLVED) {
    next.innerHTML = '<span class="solved-banner">Solved!</span>';
    sub.textContent = plan.moves.length ? `${plan.moves.length} moves` : '';
    prog.style.width = plan.moves.length ? '100%' : '0';
    progText.textContent = '';
    plan.moves.forEach(m => { const s = document.createElement('span'); s.textContent = m; s.className = 'done'; movesEl.appendChild(s); });
    return;
  }
  if (!plan.active) {
    next.textContent = '–';
    sub.textContent = solver.ready ? 'Scramble the cube, then press “Solve”.' : '';
    prog.style.width = '0'; progText.textContent = '';
    return;
  }
  plan.moves.forEach((m, i) => {
    const s = document.createElement('span');
    s.textContent = m;
    if (i < plan.idx) s.className = 'done';
    else if (i === plan.idx) s.className = plan.half ? 'half' : 'cur';
    movesEl.appendChild(s);
  });
  const m = plan.moves[plan.idx];
  next.textContent = m || '–';
  sub.textContent = m
    ? (plan.half ? 'one more quarter turn, same direction' : describeMove(m))
    : '';
  prog.style.width = (100 * plan.idx / plan.moves.length) + '%';
  progText.textContent = `Step ${Math.min(plan.idx + 1, plan.moves.length)} of ${plan.moves.length}`;
}

function describeMove(m) {
  const names = { U: 'Up (white)', D: 'Down (yellow)', R: 'Right (red)', L: 'Left (orange)', F: 'Front (green)', B: 'Back (blue)' };
  const how = m.endsWith('2') ? '180°' : m.endsWith("'") ? 'counter-clockwise' : 'clockwise';
  return `${names[m[0]]} face, ${how}`;
}

function solverStatus(text, err) {
  const el = document.getElementById('solverStatus');
  el.textContent = text; el.className = 'msg' + (err ? ' err' : '');
}

async function solveNow(reason) {
  if (!solver.ready || solving) return;
  const msg = document.getElementById('solveMsg');
  if (current === SOLVED) { clearPlan(); msg.textContent = 'Cube is already solved.'; return; }
  if (!colorCountsOk(current)) { msg.textContent = 'Current state looks invalid; cannot solve.'; msg.className = 'msg err'; return; }
  solving = true;
  const start = current;
  msg.className = 'msg';
  msg.textContent = reason ? reason + ' Calculating…' : 'Calculating…';
  const t0 = performance.now();
  try {
    const sol = (await solver.solve(start)).trim();
    const moves = sol ? sol.split(/\s+/) : [];
    setPlan(moves, start);
    msg.textContent = `${moves.length} moves, found in ${Math.round(performance.now() - t0)} ms.`;
    // The cube may have moved while we were solving.
    if (current !== start) onStateChange(current, null, true);
  } catch (e) {
    msg.textContent = e.message; msg.className = 'msg err';
  } finally {
    solving = false;
  }
}

function onSolverReady() {
  solverStatus('Solver ready (Kociemba two-phase).');
  document.getElementById('btnSolve').disabled = false;
  renderPlan();
}

/* ---------------------------------------------------------------------------
 * Central state update (from Bluetooth or the virtual cube)
 * ------------------------------------------------------------------------- */
function onStateChange(state, move, force) {
  if (state === current && !force) return;
  current = state;
  render(current);
  const onTrack = trackState(current);
  renderPlan();
  if (current === SOLVED) { plan.active = false; return; }
  if (!onTrack && !solving) {
    if (document.getElementById('autoSolve').checked) solveNow(`Off track${move ? ' (' + move + ')' : ''}.`);
    else { clearPlan(); document.getElementById('solveMsg').textContent = 'Off the planned path — press “Solve” for a new solution.'; }
  }
}

/* ---------------------------------------------------------------------------
 * Web Bluetooth
 * ------------------------------------------------------------------------- */
let device = null, stateChar = null, ctrlWrite = null;

async function connect() {
  if (!navigator.bluetooth) {
    alert('Web Bluetooth is not available in this browser.\n\nUse Chrome or Edge on desktop/Android (page must be served over https or localhost). On iOS use the Bluefy browser.');
    return;
  }
  try {
    setStatus('Choosing device…', 'busy');
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: 'Gi' },          // Xiaomi / Giiker cubes advertise as "GiCxxxxx" / "GiSxxxxx"
        { namePrefix: 'Mi Smart' },
        { services: [SVC_DATA] },
      ],
      optionalServices: [SVC_DATA, SVC_CTRL],
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    setStatus('Connecting to ' + (device.name || 'cube') + '…', 'busy');
    log('Selected ' + (device.name || device.id));
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC_DATA);
    stateChar = await svc.getCharacteristic(CHR_STATE);
    stateChar.addEventListener('characteristicvaluechanged', e => handlePacket(e.target.value));
    await stateChar.startNotifications();
    log('Notifications started on ' + CHR_STATE);
    try { handlePacket(await stateChar.readValue()); } catch (e) { log('Initial read failed: ' + e.message); }

    // Optional control channel (battery level + "mark solved").
    try {
      const ctrl = await server.getPrimaryService(SVC_CTRL);
      ctrlWrite = await ctrl.getCharacteristic(CHR_CTRL_W);
      const ctrlRead = await ctrl.getCharacteristic(CHR_CTRL_R);
      ctrlRead.addEventListener('characteristicvaluechanged', e => {
        const v = e.target.value;
        if (v.byteLength >= 2 && v.getUint8(0) === 0xb5) document.getElementById('battery').textContent = 'Battery: ' + v.getUint8(1) + '%';
      });
      await ctrlRead.startNotifications();
      await ctrlWrite.writeValue(new Uint8Array([0xb5]));
      document.getElementById('btnMarkSolved').disabled = false;
    } catch (e) {
      log('Control service not available: ' + e.message);
    }

    setStatus('Connected: ' + (device.name || 'cube'), 'on');
    document.getElementById('btnConnect').disabled = true;
    document.getElementById('btnDisconnect').disabled = false;
  } catch (e) {
    log('Connect failed: ' + e.message);
    setStatus(e.name === 'NotFoundError' ? 'Not connected' : 'Error: ' + e.message, '');
  }
}

function onDisconnected() {
  log('Disconnected');
  setStatus('Disconnected', '');
  stateChar = null; ctrlWrite = null;
  document.getElementById('btnConnect').disabled = false;
  document.getElementById('btnDisconnect').disabled = true;
  document.getElementById('btnMarkSolved').disabled = true;
  document.getElementById('battery').textContent = '';
}

function handlePacket(dv) {
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  const r = decodePacket(bytes);
  if (!r) { log('short packet ' + hex); return; }
  if (!r.valid) { log('unrecognised packet ' + hex); return; }
  const move = r.moves[0] || null;
  // Consistency check: does the reported last move explain the state change?
  if (move && current !== r.facelets && applyMoves(current, move) !== r.facelets) {
    log(`state jump (last move ${move} doesn't explain it) ${hex}`);
  } else {
    log(`${move || '·'}  ${hex}`);
  }
  onStateChange(r.facelets, move);
}

/* ---------------------------------------------------------------------------
 * Virtual cube controls
 * ------------------------------------------------------------------------- */
(function setupSim() {
  const sim = document.getElementById('sim');
  for (const suf of ['', "'"]) for (const f of 'URFDLB') {
    const b = document.createElement('button');
    b.textContent = f + suf;
    b.onclick = () => onStateChange(applyMoves(current, f + suf), f + suf);
    sim.appendChild(b);
  }
  document.getElementById('btnScramble').onclick = () => {
    const faces = 'URFDLB', sufs = ['', "'", '2'];
    let alg = [], last = '';
    while (alg.length < 20) {
      const f = faces[Math.floor(Math.random() * 6)];
      if (f === last) continue;
      last = f; alg.push(f + sufs[Math.floor(Math.random() * 3)]);
    }
    log('virtual scramble: ' + alg.join(' '));
    clearPlan();
    current = applyMoves(SOLVED, alg.join(' '));
    render(current); renderPlan();
    document.getElementById('solveMsg').textContent = 'Scrambled: ' + alg.join(' ');
  };
  document.getElementById('btnReset').onclick = () => { clearPlan(); current = SOLVED; render(current); renderPlan(); };
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === 'INPUT') return;
    const f = e.key.toUpperCase();
    if (!'URFDLB'.includes(f) || f.length !== 1) return;
    const m = f + (e.shiftKey ? "'" : '');
    onStateChange(applyMoves(current, m), m);
  });
})();

/* ---------------------------------------------------------------------------
 * Wire up
 * ------------------------------------------------------------------------- */
document.getElementById('btnConnect').onclick = connect;
document.getElementById('btnDisconnect').onclick = () => device && device.gatt.connected && device.gatt.disconnect();
document.getElementById('btnSolve').onclick = () => solveNow();
document.getElementById('btnMarkSolved').onclick = async () => {
  if (!ctrlWrite) return;
  if (!confirm('Only do this when the physical cube really is solved. Continue?')) return;
  try {
    await ctrlWrite.writeValue(new Uint8Array([0xa1]));
    log('Sent reset (0xA1)');
    clearPlan();
    onStateChange(SOLVED, null, true);
    if (stateChar) handlePacket(await stateChar.readValue());
  } catch (e) { log('Reset failed: ' + e.message); }
};

if (typeof Cube === 'undefined') {
  solverStatus('Could not load cubejs from the CDN — check your connection.', true);
} else {
  render(current);
  renderPlan();
  solver.init();
}
</script>
</body>
</html>
